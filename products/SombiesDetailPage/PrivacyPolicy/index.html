<!DOCTYPE html>
<html lang="de">

<head>
    <title>Datenschutzerklärung – Sombies</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/style.css" />
    <link rel="stylesheet" href="/products/productDetailStyleSheet.css" />
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="/js/banner.js" defer></script>
</head>

<body>
    <top-banner></top-banner>
    <main style="text-align: left; margin: 40px auto; width: 100%;">
        <h1 id="title">Datenschutzerklärung für Sombies</h1>
        <div class="loader" id="loader" style="margin: 20px auto;"></div>
        <noscript>
            <div>
                <h2>Bitte aktiviere JavaScript, um die Datenschutzerklärung zu sehen.</h2>
            </div>
        </noscript>
        <article id="privacy"></article>
    </main>

    <script>
        fetch('/legalStuff/Sombies/privacy.md')
            .then(function (response) {
                if (!response.ok) {
                    throw new Error('Netzwerkfehler: ' + response.statusText);
                }
                return response.text();
            })
            .then(function (markdownText) {
                document.getElementById('loader').style.display = 'none';
                document.getElementById('title').style.display = 'none';
                document.getElementById('privacy').innerHTML = marked.parse(markdownText);
            })
            .catch(function (error) {
                document.getElementById('loader').style.display = 'none';
                document.getElementById('privacy').innerHTML = '<p>Fehler beim Laden der Datenschutzerklärung: ' + error.message + '</p>';
            });
    </script>
</body>

</html>
